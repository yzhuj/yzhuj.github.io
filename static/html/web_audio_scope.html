<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="author" content="Yi Zhu" />
  <link rel="apple-touch-icon" sizes="180x180" href="../favicon/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon/favicon-16x16.png" />
  <link rel="manifest" href="../favicon/site.webmanifest" />
  <link rel="mask-icon" href="../favicon/safari-pinned-tab.svg" color="#5bbad5" />
  <link rel="shortcut icon" href="../favicon/favicon.ico" />
  <meta name="msapplication-TileColor" content="#da532c" />
  <meta name="msapplication-config" content="../favicon/browserconfig.xml" />
  <meta name="theme-color" content="#101419" />
  <title>Web Oscilloscope & Spectrum Analyzer</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VG7EVEDVWY"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      dataLayer.push(arguments);
    }
    gtag("js", new Date());
    gtag("config", "G-VG7EVEDVWY");
  </script>
  
  <style>
    :root {
      color-scheme: dark;
      --bg: #101419;
      --panel: #171d24;
      --line: #2a3540;
      --text: #ffffff;
      --muted: #ffffff;
      --trace: #70f5a4;
      --canvas-bg: #000000;
      --grid: #2a2a2a;
      --grid-axis: #3a3a3a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 50% -20%, #25313d, var(--bg) 55%);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
    }

    .wrap {
      width: min(1180px, 100%);
      margin: auto;
      padding: 24px;
    }

    .tabs {
      display: flex;
      border: 1px solid var(--line);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      overflow: hidden;
      background: var(--panel);
    }

    .tab {
      flex: 1;
      border: none;
      border-radius: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: #ffffff;
      padding: 12px 16px;
      font: 600 12px/1.4 inherit;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0.55;
    }

    .tab:last-child { border-right: none; }
    .tab:hover { opacity: 0.85; }
    .tab.active {
      color: #ffffff;
      background: #000;
      opacity: 1;
    }

    .scope {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 0 0 12px 12px;
      background: #000;
      box-shadow: 0 14px 42px #0006;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 8;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      padding: 14px;
      border-top: 1px solid var(--line);
      background: var(--panel);
      align-items: end;
    }

    .control {
      display: grid;
      gap: 4px;
      min-width: 105px;
    }

    .stepper-control { min-width: 108px; }

    .stepper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stepper-btns {
      display: flex;
      gap: 2px;
    }

    .stepper-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1;
      flex: 0 0 auto;
    }

    .stepper-value {
      min-width: 3.6em;
      text-align: left;
      color: #ffffff;
      font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .panel-hidden { display: none !important; }
    .display-contents { display: contents; }

    label,
    .readout-label {
      color: #ffffff;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    select,
    button {
      color: #ffffff;
      background: #222b34;
      border: 1px solid #3b4955;
      border-radius: 6px;
      padding: 8px 10px;
      font: inherit;
      accent-color: #ffffff;
    }

    button { cursor: pointer; }
    button:hover { border-color: #ffffff; }
    button.active {
      color: #ffffff;
      background: #3a4550;
      border-color: #ffffff;
    }

    .readouts {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 1px;
      border-top: 1px solid var(--line);
      background: var(--line);
    }

    .readout {
      padding: 12px 14px;
      background: var(--panel);
    }

    .readout-value {
      margin-top: 3px;
      color: #ffffff;
      font: 600 18px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    @media (max-width: 700px) {
      .wrap { padding: 13px; }
      .readouts { grid-template-columns: repeat(2, 1fr); }
      canvas { aspect-ratio: 1.25; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1 class="sr-only">Web Oscilloscope and Spectrum Analyzer</h1>
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" id="tab-scope" role="tab" aria-selected="true">Oscilloscope</button>
      <button type="button" class="tab" id="tab-spectrum" role="tab" aria-selected="false">Spectrum Analyzer</button>
    </div>

    <section class="scope">
      <canvas id="scope" width="2400" height="1200"></canvas>

      <div class="toolbar">
        <div class="control">
          <label for="input">Input</label>
          <select id="input">
            <option value="sine">Sine wave</option>
            <option value="triangle">Triangle wave</option>
            <option value="microphone">Microphone</option>
          </select>
        </div>

        <div id="scope-controls" class="display-contents">
          <div class="control stepper-control">
            <label>Time / div</label>
            <div class="stepper">
              <output class="stepper-value" id="timeValue">1 ms</output>
              <div class="stepper-btns">
                <button type="button" class="stepper-btn" id="timeDown" aria-label="Decrease time per division">−</button>
                <button type="button" class="stepper-btn" id="timeUp" aria-label="Increase time per division">+</button>
              </div>
            </div>
            <select id="time" class="sr-only" tabindex="-1" aria-hidden="true">
              <option value="0.0001">100 µs</option>
              <option value="0.001" selected>1 ms</option>
              <option value="0.01">10 ms</option>
              <option value="0.1">100 ms</option>
              <option value="0.25">250 ms</option>
            </select>
          </div>

          <div class="control stepper-control">
            <label>Volts / div</label>
            <div class="stepper">
              <output class="stepper-value" id="voltsValue">1 V</output>
              <div class="stepper-btns">
                <button type="button" class="stepper-btn" id="voltsDown" aria-label="Decrease volts per division">−</button>
                <button type="button" class="stepper-btn" id="voltsUp" aria-label="Increase volts per division">+</button>
              </div>
            </div>
            <select id="volts" class="sr-only" tabindex="-1" aria-hidden="true">
              <option value="0.01">10 mV</option>
              <option value="0.1">100 mV</option>
              <option value="0.25">250 mV</option>
              <option value="0.5">500 mV</option>
              <option value="1" selected>1 V</option>
              <option value="2">2 V</option>
            </select>
          </div>

          <div class="control stepper-control">
            <label>Trigger Level</label>
            <div class="stepper">
              <output class="stepper-value" id="triggerValue">0.0 V</output>
              <div class="stepper-btns">
                <button type="button" class="stepper-btn" id="triggerDown" aria-label="Decrease trigger level">−</button>
                <button type="button" class="stepper-btn" id="triggerUp" aria-label="Increase trigger level">+</button>
              </div>
            </div>
          </div>

          <div class="control">
            <label for="triggerMode">Trigger</label>
            <select id="triggerMode">
              <option value="none">Untriggered</option>
              <option value="rising" selected>Rising</option>
              <option value="falling">Falling</option>
            </select>
          </div>

          <button id="single" type="button">Single</button>
        </div>

        <div id="spectrum-controls" class="display-contents panel-hidden">
          <div class="control stepper-control">
            <label>FFT size</label>
            <div class="stepper">
              <output class="stepper-value" id="fftSizeValue">8192</output>
              <div class="stepper-btns">
                <button type="button" class="stepper-btn" id="fftSizeDown" aria-label="Decrease FFT size">−</button>
                <button type="button" class="stepper-btn" id="fftSizeUp" aria-label="Increase FFT size">+</button>
              </div>
            </div>
            <select id="fftSize" class="sr-only" tabindex="-1" aria-hidden="true">
              <option value="512">512</option>
              <option value="1024">1024</option>
              <option value="2048">2048</option>
              <option value="4096">4096</option>
              <option value="8192" selected>8192</option>
              <option value="16384">16384</option>
            </select>
          </div>
          <div class="control stepper-control">
            <label>Freq span</label>
            <div class="stepper">
              <output class="stepper-value" id="spanValue">5 kHz</output>
              <div class="stepper-btns">
                <button type="button" class="stepper-btn" id="spanDown" aria-label="Decrease frequency span">−</button>
                <button type="button" class="stepper-btn" id="spanUp" aria-label="Increase frequency span">+</button>
              </div>
            </div>
            <select id="span" class="sr-only" tabindex="-1" aria-hidden="true">
              <option value="1000">1 kHz</option>
              <option value="5000" selected>5 kHz</option>
              <option value="10000">10 kHz</option>
              <option value="20000">20 kHz</option>
            </select>
          </div>
          <div class="control stepper-control">
            <label>dB / div</label>
            <div class="stepper">
              <output class="stepper-value" id="dbDivValue">15 dB</output>
              <div class="stepper-btns">
                <button type="button" class="stepper-btn" id="dbDivDown" aria-label="Decrease dB per division">−</button>
                <button type="button" class="stepper-btn" id="dbDivUp" aria-label="Increase dB per division">+</button>
              </div>
            </div>
            <select id="dbDiv" class="sr-only" tabindex="-1" aria-hidden="true">
              <option value="5">5 dB</option>
              <option value="10">10 dB</option>
              <option value="15" selected>15 dB</option>
              <option value="20">20 dB</option>
            </select>
          </div>
          <div class="control stepper-control">
            <label>Ref level</label>
            <div class="stepper">
              <output class="stepper-value" id="refLevelValue">0 dBFS</output>
              <div class="stepper-btns">
                <button type="button" class="stepper-btn" id="refLevelDown" aria-label="Decrease reference level">−</button>
                <button type="button" class="stepper-btn" id="refLevelUp" aria-label="Increase reference level">+</button>
              </div>
            </div>
            <select id="refLevel" class="sr-only" tabindex="-1" aria-hidden="true">
              <option value="-40">−40 dBFS</option>
              <option value="-20">−20 dBFS</option>
              <option value="-10">−10 dBFS</option>
              <option value="0" selected>0 dBFS</option>
            </select>
          </div>
          <div class="control stepper-control">
            <label>Averages</label>
            <div class="stepper">
              <output class="stepper-value" id="averagesValue">1</output>
              <div class="stepper-btns">
                <button type="button" class="stepper-btn" id="averagesDown" aria-label="Decrease number of averages">−</button>
                <button type="button" class="stepper-btn" id="averagesUp" aria-label="Increase number of averages">+</button>
              </div>
            </div>
            <select id="averages" class="sr-only" tabindex="-1" aria-hidden="true">
              <option value="1" selected>1</option>
              <option value="2">2</option>
              <option value="4">4</option>
              <option value="8">8</option>
              <option value="16">16</option>
              <option value="32">32</option>
              <option value="64">64</option>
            </select>
          </div>
        </div>

        <button id="pause" type="button">Pause</button>
      </div>

      <div class="readouts" id="readouts-scope">
        <div class="readout">
          <div class="readout-label">Frequency</div>
          <div class="readout-value" id="measureFrequency">—</div>
        </div>
        <div class="readout">
          <div class="readout-label">Peak-to-peak</div>
          <div class="readout-value" id="measureVpp">—</div>
        </div>
        <div class="readout">
          <div class="readout-label">RMS</div>
          <div class="readout-value" id="measureRms">—</div>
        </div>
        <div class="readout">
          <div class="readout-label">Sample rate</div>
          <div class="readout-value" id="measureRate">—</div>
        </div>
      </div>

      <div class="readouts panel-hidden" id="readouts-spectrum">
        <div class="readout">
          <div class="readout-label">Peak frequency</div>
          <div class="readout-value" id="measurePeakFreq">—</div>
        </div>
        <div class="readout">
          <div class="readout-label">Peak level</div>
          <div class="readout-value" id="measurePeakDb">—</div>
        </div>
        <div class="readout">
          <div class="readout-label">FFT size</div>
          <div class="readout-value" id="measureFftSize">—</div>
        </div>
        <div class="readout">
          <div class="readout-label">Sample rate</div>
          <div class="readout-value" id="measureSpecRate">—</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#scope");
    const ctx = canvas.getContext("2d");
    const $ = (id) => document.getElementById(id);

    // --- Constants -----------------------------------------------------------
    const H_DIVS = 10;
    const V_DIVS = 8;
    const VERTICAL_FULL_SCALE_DIVS = 4;
    const CAPTURE_SIZE = 2048;
    // Longest sweep is 250 ms/div × 10 divs (2.5 s); keep headroom for trigger search.
    const RING_SECONDS = 6;
    const DEFAULT_SAMPLE_RATE = 48000;
    const GENERATOR_VPP = 2;
    const GENERATOR_FREQUENCY = 1000;

    // --- State ---------------------------------------------------------------
    let viewMode = "scope"; // "scope" | "spectrum"
    let paused = false;
    let singleShotArmed = false;
    let audioCtx = null;
    let outputNode = null;
    let captureNode = null;
    let captureMute = null;
    let stream = null;
    let lastFrameTime = 0;
    let phase = 0;
    let frozenSamples = null;
    let frozenSpectrum = null;
    let audioInputGeneration = 0;
    // Sized for the default rate; resized once if the AudioContext differs.
    let ringBuffer = new Float32Array(DEFAULT_SAMPLE_RATE * RING_SECONDS);
    let ringWrite = 0;
    let ringFilled = 0;
    let spectrumAvgPower = null;
    let spectrumAvgCount = 0;
    let micStatusMessage = null;
    let sampleRate = DEFAULT_SAMPLE_RATE;
    let generatorMode = true;
    let fullScaleVolts = 1 * VERTICAL_FULL_SCALE_DIVS;
    let windowSampleCount = Math.max(2, Math.round(0.001 * H_DIVS * sampleRate));

    const settings = {
      timePerDiv: 0.001,
      voltsPerDiv: 1,
      triggerVolts: 0,
      triggerMode: "rising",
      wave: "sine",
      freqSpan: 5000,
      dbPerDiv: 15,
      refLevelDb: 0,
      fftSize: 8192,
      averages: 1,
    };

    // --- Helpers -------------------------------------------------------------
    function formatHz(hz) {
      if (hz >= 1000) {
        return (hz / 1000).toFixed(hz >= 10000 ? 1 : 2) + " kHz";
      }
      return hz.toFixed(1) + " Hz";
    }


    function trimNum(value, digits) {
      if (Math.abs(value) < 1e-12) return "0";
      const fixed = value.toFixed(digits);
      return fixed.replace(/\.?0+$/, "");
    }

    function scopeTimeScale() {
      if (settings.timePerDiv >= 1) return { unit: "s", scale: 1, digits: 2 };
      if (settings.timePerDiv >= 1e-3) return { unit: "ms", scale: 1e3, digits: 1 };
      return { unit: "µs", scale: 1e6, digits: 0 };
    }

    function scopeVoltsScale() {
      if (settings.voltsPerDiv >= 0.25) return { unit: "V", scale: 1, digits: 1 };
      return { unit: "mV", scale: 1e3, digits: 0 };
    }

    function spectrumHzScale(maxHz) {
      if (maxHz >= 1000) return { unit: "kHz", scale: 1e-3, digits: 1 };
      return { unit: "Hz", scale: 1, digits: 0 };
    }

    function formatTickNumber(value, { scale, digits }) {
      const scaled = value * scale;
      if (Math.abs(scaled) < 1e-12) return "0";
      if (digits === 0) return String(Math.round(scaled));
      return trimNum(scaled, digits);
    }


    // Plot inset for tick numbers + side unit labels.
    const PLOT_MARGIN = { left: 120, right: 90, top: 48, bottom: 70 };
    const plotArea = {
      x: PLOT_MARGIN.left,
      y: PLOT_MARGIN.top,
      w: canvas.width - PLOT_MARGIN.left - PLOT_MARGIN.right,
      h: canvas.height - PLOT_MARGIN.top - PLOT_MARGIN.bottom,
    };


    function syncGeneratorSettings() {
      const mode = $("input").value;
      if (mode === "sine" || mode === "triangle") {
        settings.wave = mode;
      }
    }

    function sampleToY(sample, plot) {
      const scale = fullScaleVolts;
      return (
        plot.y +
        plot.h / 2 -
        (sample / scale) * plot.h * VERTICAL_FULL_SCALE_DIVS
      );
    }



    function clearScopeReadouts() {
      $("measureFrequency").textContent = "—";
      $("measureVpp").textContent = "—";
      $("measureRms").textContent = "—";
      $("measureRate").textContent = audioCtx
        ? Math.round(sampleRate / 1000) + " kHz"
        : "simulated";
    }

    // --- Ring buffer (microphone capture) ------------------------------------
    function resizeRingBufferIfNeeded() {
      const needed = Math.ceil(sampleRate * RING_SECONDS);
      if (ringBuffer.length === needed) return;
      ringBuffer = new Float32Array(needed);
      ringWrite = 0;
      ringFilled = 0;
    }

    function pushToRing(chunk) {
      const n = chunk.length;
      const len = ringBuffer.length;
      const first = Math.min(n, len - ringWrite);
      ringBuffer.set(chunk.subarray(0, first), ringWrite);
      if (first < n) {
        ringBuffer.set(chunk.subarray(first), 0);
      }
      ringWrite = (ringWrite + n) % len;
      ringFilled = Math.min(len, ringFilled + n);
    }

    function clearRing() {
      ringBuffer.fill(0);
      ringWrite = 0;
      ringFilled = 0;
    }

    function copyRecentFromRing(count) {
      const n = Math.min(count, ringFilled);
      const out = new Float32Array(n);
      if (n === 0) return out;

      const len = ringBuffer.length;
      const start = (ringWrite - n + len) % len;
      const first = Math.min(n, len - start);
      out.set(ringBuffer.subarray(start, start + first), 0);
      if (first < n) {
        out.set(ringBuffer.subarray(0, n - first), first);
      }
      return out;
    }

    // --- Audio input ---------------------------------------------------------
    function disconnectCurrentSource() {
      if (outputNode) {
        try { outputNode.disconnect(); } catch (_) {}
        outputNode = null;
      }
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }
    }

    function ensureCaptureGraph() {
      if (captureNode) return;

      captureNode = audioCtx.createScriptProcessor(CAPTURE_SIZE, 1, 1);
      captureMute = audioCtx.createGain();
      captureMute.gain.value = 0;
      captureNode.onaudioprocess = (event) => {
        if (!generatorMode) {
          pushToRing(event.inputBuffer.getChannelData(0));
        }
      };
      captureNode.connect(captureMute);
      captureMute.connect(audioCtx.destination);
    }

    function ensureAudioContext() {
      if (audioCtx) return true;

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) {
        return false;
      }

      audioCtx = new AudioContextClass();
      sampleRate = audioCtx.sampleRate;
      windowSampleCount = Math.max(
        2,
        Math.round(settings.timePerDiv * H_DIVS * sampleRate)
      );
      resizeRingBufferIfNeeded();
      ensureCaptureGraph();
      return true;
    }

    function setupGenerator() {
      audioInputGeneration += 1;
      disconnectCurrentSource();
      clearRing();
      syncGeneratorSettings();
      micStatusMessage = null;
    }

    function setupMicrophone() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        micStatusMessage = "NO MICROPHONE FOUND";
        return;
      }

      if (!ensureAudioContext()) {
        micStatusMessage = "NO MICROPHONE FOUND";
        return;
      }
      if (audioCtx.state === "suspended") audioCtx.resume();

      const generation = ++audioInputGeneration;
      disconnectCurrentSource();
      clearRing();
      ensureCaptureGraph();
      micStatusMessage = "REQUESTING MICROPHONE…";

      navigator.mediaDevices
        .getUserMedia({
          audio: {
            autoGainControl: false,
            echoCancellation: false,
            noiseSuppression: false,
          },
        })
        .then((mediaStream) => {
          if (generation !== audioInputGeneration || generatorMode) {
            mediaStream.getTracks().forEach((track) => track.stop());
            return;
          }

          if (audioCtx.state === "suspended") audioCtx.resume();

          stream = mediaStream;
          outputNode = audioCtx.createMediaStreamSource(mediaStream);
          outputNode.connect(captureNode);
          micStatusMessage = null;
        })
        .catch((error) => {
          if (generation !== audioInputGeneration || generatorMode) return;
          const name = error && error.name;
          if (
            name === "NotFoundError" ||
            name === "DevicesNotFoundError" ||
            name === "OverconstrainedError"
          ) {
            micStatusMessage = "NO MICROPHONE FOUND";
          } else if (
            name === "NotAllowedError" ||
            name === "PermissionDeniedError"
          ) {
            micStatusMessage = "MIC PERMISSION DENIED";
          } else {
            micStatusMessage = "NO MICROPHONE FOUND";
          }
        });
    }

    function setupAudio() {
      syncGeneratorSettings();
      generatorMode = $("input").value !== "microphone";
      if (generatorMode) {
        setupGenerator();
      } else {
        setupMicrophone();
      }
    }

    // --- Settings / UI controls ----------------------------------------------
    function clampTriggerLevel() {
      const max = fullScaleVolts;
      let volts = Math.round(settings.triggerVolts * 10) / 10;
      volts = Math.max(-max, Math.min(max, volts));
      if (Math.abs(volts) < 1e-9) volts = 0;
      settings.triggerVolts = volts;
      const label = (Math.round(volts * 10) / 10).toFixed(1) + " V";
      $("triggerValue").value = label;
      $("triggerValue").textContent = label;
    }

    function bumpTriggerLevel(deltaSteps) {
      settings.triggerVolts =
        Math.round(settings.triggerVolts * 10 + deltaSteps) / 10;
      clampTriggerLevel();
    }

    function readSettings() {
      settings.timePerDiv = Number($("time").value);
      settings.voltsPerDiv = Number($("volts").value);
      settings.triggerMode = $("triggerMode").value;
      settings.freqSpan = Number($("span").value);
      settings.dbPerDiv = Number($("dbDiv").value);
      settings.refLevelDb = Number($("refLevel").value);
      const nextFftSize = Number($("fftSize").value);
      const nextAverages = Number($("averages").value);
      if (
        nextFftSize !== settings.fftSize ||
        nextAverages !== settings.averages
      ) {
        spectrumAvgPower = null;
        spectrumAvgCount = 0;
      }
      settings.fftSize = nextFftSize;
      settings.averages = nextAverages;
      fullScaleVolts = settings.voltsPerDiv * VERTICAL_FULL_SCALE_DIVS;
      windowSampleCount = Math.max(
        2,
        Math.round(settings.timePerDiv * H_DIVS * sampleRate)
      );
      syncGeneratorSettings();
      clampTriggerLevel();
    }

    function setViewMode(mode) {
      viewMode = mode;
      const scopeActive = mode === "scope";

      $("tab-scope").classList.toggle("active", scopeActive);
      $("tab-spectrum").classList.toggle("active", !scopeActive);
      $("tab-scope").setAttribute("aria-selected", String(scopeActive));
      $("tab-spectrum").setAttribute("aria-selected", String(!scopeActive));

      $("scope-controls").classList.toggle("panel-hidden", !scopeActive);
      $("spectrum-controls").classList.toggle("panel-hidden", scopeActive);
      $("readouts-scope").classList.toggle("panel-hidden", !scopeActive);
      $("readouts-spectrum").classList.toggle("panel-hidden", scopeActive);
    }

    function createStepper({ valueId, selectId, downId, upId }) {
      const valueEl = $(valueId);
      const select = $(selectId);
      const steps = Array.from(select.options).map((option) => ({
        value: option.value,
        label: option.textContent,
      }));

      let index = Math.max(
        0,
        steps.findIndex((step) => step.value === select.value)
      );

      function applyIndex(nextIndex, { silent } = {}) {
        index = Math.max(0, Math.min(steps.length - 1, nextIndex));
        const step = steps[index];
        select.value = step.value;
        valueEl.value = step.label;
        valueEl.textContent = step.label;
        if (!silent) {
          select.dispatchEvent(new Event("change", { bubbles: true }));
        }
      }

      $(downId).addEventListener("click", () => applyIndex(index - 1));
      $(upId).addEventListener("click", () => applyIndex(index + 1));

      return {
        setValue(value) {
          const next = steps.findIndex((step) => step.value === String(value));
          applyIndex(next < 0 ? 0 : next, { silent: true });
        },
      };
    }

    // --- Drawing -------------------------------------------------------------
    function drawGrid(width, height, { crosshair = false, mode = "scope" } = {}) {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      const plot = plotArea;

      ctx.save();
      ctx.beginPath();
      ctx.rect(plot.x, plot.y, plot.w, plot.h);
      ctx.clip();

      ctx.strokeStyle = "#2a2a2a";
      ctx.lineWidth = 1;

      for (let i = 0; i <= H_DIVS; i++) {
        const x = plot.x + (i * plot.w) / H_DIVS;
        ctx.beginPath();
        ctx.moveTo(x, plot.y);
        ctx.lineTo(x, plot.y + plot.h);
        ctx.stroke();
      }

      for (let i = 0; i <= V_DIVS; i++) {
        const y = plot.y + (i * plot.h) / V_DIVS;
        ctx.beginPath();
        ctx.moveTo(plot.x, y);
        ctx.lineTo(plot.x + plot.w, y);
        ctx.stroke();
      }

      if (crosshair) {
        ctx.strokeStyle = "#3a3a3a";
        ctx.beginPath();
        ctx.moveTo(plot.x + plot.w / 2, plot.y);
        ctx.lineTo(plot.x + plot.w / 2, plot.y + plot.h);
        ctx.moveTo(plot.x, plot.y + plot.h / 2);
        ctx.lineTo(plot.x + plot.w, plot.y + plot.h / 2);
        ctx.stroke();
      }

      ctx.restore();

      // Plot border
      ctx.strokeStyle = "#555555";
      ctx.lineWidth = 1;
      ctx.strokeRect(plot.x + 0.5, plot.y + 0.5, plot.w - 1, plot.h - 1);

      drawAxisTicks(plot, mode);
      return plot;
    }

    function drawAxisTicks(plot, mode) {
      ctx.save();
      ctx.strokeStyle = "#ffffff";
      ctx.fillStyle = "#ffffff";
      ctx.lineWidth = 1;
      ctx.font = "28px ui-monospace, SFMono-Regular, Menlo, monospace";

      const yScale =
        mode === "scope"
          ? scopeVoltsScale()
          : { unit: "dB", scale: 1, digits: 0 };
      const maxHz =
        mode === "spectrum"
          ? Math.min(settings.freqSpan, sampleRate / 2)
          : 0;
      const xScale =
        mode === "scope" ? scopeTimeScale() : spectrumHzScale(maxHz);

      // Y ticks + bare numbers
      ctx.textAlign = "right";
      for (let i = 0; i <= V_DIVS; i++) {
        const y = plot.y + (i * plot.h) / V_DIVS;
        ctx.beginPath();
        ctx.moveTo(plot.x - 10, y);
        ctx.lineTo(plot.x, y);
        ctx.stroke();

        const value =
          mode === "scope"
            ? fullScaleVolts * (1 - (2 * i) / V_DIVS)
            : settings.refLevelDb - i * settings.dbPerDiv;
        const label =
          mode === "scope"
            ? formatTickNumber(value, yScale)
            : String(value);

        ctx.textBaseline =
          i === 0 ? "top" : i === V_DIVS ? "bottom" : "middle";
        ctx.fillText(label, plot.x - 14, y);
      }

      // X ticks + bare numbers
      ctx.textBaseline = "top";
      for (let i = 0; i <= H_DIVS; i++) {
        const x = plot.x + (i * plot.w) / H_DIVS;
        ctx.beginPath();
        ctx.moveTo(x, plot.y + plot.h);
        ctx.lineTo(x, plot.y + plot.h + 10);
        ctx.stroke();

        const value =
          mode === "scope"
            ? i * settings.timePerDiv
            : (i / H_DIVS) * maxHz;

        if (i === 0) ctx.textAlign = "left";
        else if (i === H_DIVS) ctx.textAlign = "right";
        else ctx.textAlign = "center";

        ctx.fillText(formatTickNumber(value, xScale), x, plot.y + plot.h + 14);
      }

      // Unit labels off to the side (not centered on the axis)
      ctx.font = "600 28px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.textAlign = "right";
      ctx.textBaseline = "bottom";
      ctx.fillText(yScale.unit, plot.x - 14, plot.y - 10);

      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(
        xScale.unit,
        plot.x + plot.w + 16,
        plot.y + plot.h + 14
      );

      ctx.restore();
    }

    function drawTriggerLevel(plot) {
      const y = sampleToY(settings.triggerVolts / fullScaleVolts, plot);
      ctx.save();
      ctx.beginPath();
      ctx.rect(plot.x, plot.y, plot.w, plot.h);
      ctx.clip();
      ctx.strokeStyle = "#ffe14a";
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 5]);
      ctx.beginPath();
      ctx.moveTo(plot.x, y);
      ctx.lineTo(plot.x + plot.w, y);
      ctx.stroke();
      ctx.restore();
    }

    function drawStatusBadge(text, plot, topY) {
      ctx.save();
      const fontSize = 33;
      ctx.font = `700 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      const padX = 16;
      const padY = 12;
      const labelWidth = ctx.measureText(text).width;
      const boxW = labelWidth + padX * 2 + 10;
      const boxH = fontSize + padY * 2;
      const x = plot.x + 14;
      const y = topY;

      ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
      ctx.fillRect(x, y, boxW, boxH);
      ctx.fillStyle = "#ffe14a";
      ctx.fillRect(x, y, 6, boxH);

      ctx.fillStyle = "#ffe14a";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x + padX + 6, y + boxH / 2);
      ctx.restore();
      return boxH;
    }

    function drawStatusStack(plot, labels) {
      let topY = plot.y + 14;
      for (const text of labels) {
        if (!text) continue;
        topY += drawStatusBadge(text, plot, topY) + 10;
      }
    }


    function drawScopeStatus(plot, { waitingForTrigger = false } = {}) {
      const labels = [];
      if (paused) {
        labels.push("PAUSED");
      } else if (waitingForTrigger || singleShotArmed) {
        labels.push(singleShotArmed ? "ARMED" : "UNTRIGGERED");
      }
      labels.push((!generatorMode ? micStatusMessage : null));
      drawStatusStack(plot, labels);
    }

    function drawSpectrumStatus(plot) {
      const labels = [];
      if (paused) labels.push("PAUSED");
      labels.push((!generatorMode ? micStatusMessage : null));
      drawStatusStack(plot, labels);
    }

    function drawWaveform(samples, plot) {
      const n = samples.length;
      if (n < 2) return;

      ctx.save();
      ctx.beginPath();
      ctx.rect(plot.x, plot.y, plot.w, plot.h);
      ctx.clip();

      ctx.strokeStyle = "#70f5a4";
      ctx.lineWidth = 2;
      ctx.beginPath();

      if (n <= plot.w) {
        // Draw every sample across the plot width.
        for (let i = 0; i < n; i++) {
          const x = plot.x + (i / (n - 1)) * (plot.w - 1);
          const y = sampleToY(samples[i] || 0, plot);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
      } else {
        // More samples than pixels: min/max envelope per column so peaks aren't lost.
        for (let i = 0; i < plot.w; i++) {
          const start = Math.floor((i / plot.w) * n);
          const end = Math.max(start + 1, Math.floor(((i + 1) / plot.w) * n));
          let min = Infinity;
          let max = -Infinity;
          for (let j = start; j < end; j++) {
            const value = samples[j] || 0;
            if (value < min) min = value;
            if (value > max) max = value;
          }
          const x = plot.x + i;
          const yMin = sampleToY(min, plot);
          const yMax = sampleToY(max, plot);
          ctx.moveTo(x, yMin);
          ctx.lineTo(x, yMax);
        }
      }

      ctx.stroke();
      ctx.restore();
    }

    function drawSpectrum(magnitudesDb, plot) {
      const binHz = sampleRate / settings.fftSize;
      const maxHz = Math.min(settings.freqSpan, sampleRate / 2);
      const topDb = settings.refLevelDb;
      const bottomDb = topDb - settings.dbPerDiv * V_DIVS;
      const maxBin = Math.min(
        magnitudesDb.length - 1,
        Math.floor(maxHz / binHz)
      );

      ctx.save();
      ctx.beginPath();
      ctx.rect(plot.x, plot.y, plot.w, plot.h);
      ctx.clip();

      ctx.strokeStyle = "#70f5a4";
      ctx.fillStyle = "rgba(112, 245, 164, 0.18)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(plot.x, plot.y + plot.h);

      let peakDb = -Infinity;
      let peakBin = 0;
      const peakYs = new Array(Math.ceil(plot.w));

      for (let i = 0; i < plot.w; i++) {
        const freq = (i / Math.max(plot.w - 1, 1)) * maxHz;
        const bin = Math.min(maxBin, Math.round(freq / binHz));
        const db = magnitudesDb[bin];
        if (db > peakDb) {
          peakDb = db;
          peakBin = bin;
        }
        const y = Math.min(
          plot.y + plot.h,
          Math.max(
            plot.y,
            plot.y + ((topDb - db) / (topDb - bottomDb)) * plot.h
          )
        );
        peakYs[i] = y;
        ctx.lineTo(plot.x + i, y);
      }

      ctx.lineTo(plot.x + plot.w, plot.y + plot.h);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      const peakHz = peakBin * binHz;
      const peakX =
        plot.x + (maxHz > 0 ? (peakHz / maxHz) * (plot.w - 1) : 0);
      const peakY =
        peakYs[Math.round(peakX - plot.x)] ?? plot.y + plot.h / 2;

      ctx.strokeStyle = "#ffffff";
      ctx.fillStyle = "#ffffff";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(peakX, peakY);
      ctx.lineTo(peakX, Math.max(plot.y + 18, peakY - 18));
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(peakX, peakY, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = "600 26px ui-monospace, SFMono-Regular, Menlo, monospace";
      ctx.textBaseline = "bottom";
      const label = formatHz(peakHz);
      const labelWidth = ctx.measureText(label).width;
      let labelX = peakX + 10;
      if (labelX + labelWidth > plot.x + plot.w - 10) {
        labelX = peakX - 10 - labelWidth;
      }
      ctx.fillText(
        label,
        Math.max(plot.x + 10, labelX),
        Math.max(plot.y + 28, peakY - 10)
      );
      ctx.restore();

      return { peakHz, peakDb };
    }

    // --- Signal generation / capture -----------------------------------------
    function sampleWaveform(phaseRadians) {
      const amp = GENERATOR_VPP / 2 / fullScaleVolts;
      if (settings.wave === "triangle") {
        const p = ((phaseRadians / (2 * Math.PI)) % 1 + 1) % 1;
        const tri = p < 0.5 ? 4 * p - 1 : 3 - 4 * p;
        return amp * tri;
      }
      return amp * Math.sin(phaseRadians);
    }

    function findTriggerIndex(samples) {
      if (settings.triggerMode === "none") return 0;

      const threshold = settings.triggerVolts / fullScaleVolts;
      for (let i = 1; i < samples.length; i++) {
        const previous = samples[i - 1];
        const current = samples[i];
        const rising =
          settings.triggerMode === "rising" &&
          previous < threshold &&
          current >= threshold;
        const falling =
          settings.triggerMode === "falling" &&
          previous > threshold &&
          current <= threshold;
        if (rising || falling) return i;
      }
      return -1;
    }

    function generateSamples(frameTime) {
      // Oversample relative to the display so the trace stays smooth on fast timebases.
      const windowCount = Math.max(windowSampleCount, canvas.width * 4);
      const samplePeriod = (settings.timePerDiv * H_DIVS) / windowCount;
      const search = new Float32Array(windowCount * 2);

      for (let i = 0; i < search.length; i++) {
        const t = i * samplePeriod + phase;
        search[i] = sampleWaveform(t * GENERATOR_FREQUENCY * 2 * Math.PI);
      }

      phase += (frameTime - lastFrameTime) / 1000;

      let start = 0;
      if (settings.triggerMode !== "none") {
        const triggerAt = findTriggerIndex(search);
        if (triggerAt < 0) return null;
        start = Math.min(triggerAt, windowCount);
      }

      return new Float32Array(search.subarray(start, start + windowCount));
    }

    function captureMicrophoneWindow() {
      const windowCount = windowSampleCount;
      const searchCount = Math.min(
        ringFilled,
        Math.max(windowCount * 2, windowCount + CAPTURE_SIZE)
      );
      const recent = copyRecentFromRing(searchCount);

      if (recent.length < 2) {
        return settings.triggerMode === "none"
          ? new Float32Array(windowCount)
          : null;
      }

      let start;
      if (settings.triggerMode === "none") {
        start = Math.max(0, recent.length - windowCount);
      } else {
        const triggerAt = findTriggerIndex(recent);
        if (triggerAt < 0) return null;
        start = Math.min(triggerAt, Math.max(0, recent.length - windowCount));
      }

      const window = new Float32Array(windowCount);
      for (let i = 0; i < windowCount; i++) {
        const index = start + i;
        window[i] = index < recent.length ? recent[index] : 0;
      }
      return window;
    }

    function spectrumTimeSamples(frameTime) {
      const fftSize = settings.fftSize;

      if (!generatorMode && stream && ringFilled > 0) {
        const fromRing = copyRecentFromRing(fftSize);
        if (fromRing.length === fftSize) return fromRing;
        const padded = new Float32Array(fftSize);
        padded.set(fromRing, fftSize - fromRing.length);
        return padded;
      }

      const samples = new Float32Array(fftSize);
      for (let i = 0; i < fftSize; i++) {
        const t = phase + i / sampleRate;
        samples[i] = sampleWaveform(t * GENERATOR_FREQUENCY * 2 * Math.PI);
      }
      phase += (frameTime - lastFrameTime) / 1000;
      return samples;
    }

    // --- FFT / measurements --------------------------------------------------
    function fft(real, imag) {
      const n = real.length;
      let j = 0;
      for (let i = 1; i < n; i++) {
        let bit = n >> 1;
        for (; j & bit; bit >>= 1) j ^= bit;
        j ^= bit;
        if (i < j) {
          [real[i], real[j]] = [real[j], real[i]];
          [imag[i], imag[j]] = [imag[j], imag[i]];
        }
      }

      for (let len = 2; len <= n; len <<= 1) {
        const ang = (-2 * Math.PI) / len;
        const wlenRe = Math.cos(ang);
        const wlenIm = Math.sin(ang);
        for (let i = 0; i < n; i += len) {
          let wRe = 1;
          let wIm = 0;
          for (let k = 0; k < len / 2; k++) {
            const uRe = real[i + k];
            const uIm = imag[i + k];
            const vRe =
              real[i + k + len / 2] * wRe - imag[i + k + len / 2] * wIm;
            const vIm =
              real[i + k + len / 2] * wIm + imag[i + k + len / 2] * wRe;
            real[i + k] = uRe + vRe;
            imag[i + k] = uIm + vIm;
            real[i + k + len / 2] = uRe - vRe;
            imag[i + k + len / 2] = uIm - vIm;
            const nextWRe = wRe * wlenRe - wIm * wlenIm;
            wIm = wRe * wlenIm + wIm * wlenRe;
            wRe = nextWRe;
          }
        }
      }
    }

    function computeSpectrumPower(timeSamples) {
      const fftSize = timeSamples.length;
      const real = new Float32Array(fftSize);
      const imag = new Float32Array(fftSize);

      for (let i = 0; i < fftSize; i++) {
        const hann = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (fftSize - 1)));
        real[i] = (timeSamples[i] || 0) * hann;
      }

      fft(real, imag);

      const bins = fftSize / 2;
      const power = new Float32Array(bins);
      const norm = fftSize / 2;
      for (let k = 0; k < bins; k++) {
        const mag = Math.hypot(real[k], imag[k]) / norm;
        power[k] = mag * mag;
      }
      return power;
    }

    function powerToDb(power) {
      const magnitudesDb = new Float32Array(power.length);
      for (let k = 0; k < power.length; k++) {
        magnitudesDb[k] = 10 * Math.log10(power[k] + 1e-24);
      }
      return magnitudesDb;
    }


    function computeAveragedSpectrum(timeSamples) {
      const power = computeSpectrumPower(timeSamples);
      const nAvg = Math.max(1, settings.averages);

      if (nAvg <= 1) {
        spectrumAvgPower = null;
        spectrumAvgCount = 0;
        return powerToDb(power);
      }

      if (!spectrumAvgPower || spectrumAvgPower.length !== power.length) {
        spectrumAvgPower = new Float32Array(power.length);
        spectrumAvgCount = 0;
      }

      // Exponential average with effective length nAvg (power domain).
      const alpha = 1 / nAvg;
      if (spectrumAvgCount === 0) {
        spectrumAvgPower.set(power);
      } else {
        for (let k = 0; k < power.length; k++) {
          spectrumAvgPower[k] =
            spectrumAvgPower[k] * (1 - alpha) + power[k] * alpha;
        }
      }
      spectrumAvgCount = Math.min(spectrumAvgCount + 1, nAvg);
      return powerToDb(spectrumAvgPower);
    }

    function updateScopeMeasurements(samples) {
      let min = Infinity;
      let max = -Infinity;
      let sumSquares = 0;
      for (const value of samples) {
        min = Math.min(min, value);
        max = Math.max(max, value);
        sumSquares += value * value;
      }

      const threshold = settings.triggerVolts / fullScaleVolts;
      const crossings = [];
      for (let i = 1; i < samples.length; i++) {
        if (samples[i - 1] < threshold && samples[i] >= threshold) {
          crossings.push(i);
        }
      }

      const samplePeriod = (settings.timePerDiv * H_DIVS) / samples.length;
      let measuredHz = 0;
      if (crossings.length > 1) {
        const span = crossings.at(-1) - crossings[0];
        measuredHz = (crossings.length - 1) / (span * samplePeriod);
      }

      const scale = fullScaleVolts;
      $("measureFrequency").textContent = measuredHz ? formatHz(measuredHz) : "—";
      $("measureVpp").textContent = ((max - min) * scale).toFixed(2) + " V";
      $("measureRms").textContent =
        Math.sqrt((sumSquares / samples.length) * scale * scale).toFixed(2) + " V";
      $("measureRate").textContent = audioCtx
        ? Math.round(sampleRate / 1000) + " kHz"
        : "simulated";
    }

    function updateSpectrumMeasurements(peak) {
      $("measurePeakFreq").textContent = Number.isFinite(peak.peakHz)
        ? formatHz(peak.peakHz)
        : "—";
      $("measurePeakDb").textContent = Number.isFinite(peak.peakDb)
        ? peak.peakDb.toFixed(1) + " dB"
        : "—";
      $("measureFftSize").textContent = String(settings.fftSize);
      $("measureSpecRate").textContent =
        Math.round(sampleRate / 1000) + " kHz";
    }

    // --- Frame loop ----------------------------------------------------------
    function drawScopeFrame(frameTime, width, height) {
      const plot = drawGrid(width, height, { crosshair: true, mode: "scope" });
      drawTriggerLevel(plot);

      let samples;
      if (!paused) {
        samples =
          !generatorMode && stream
            ? captureMicrophoneWindow()
            : generateSamples(frameTime);
        lastFrameTime = frameTime;

        if (!samples) {
          clearScopeReadouts();
          drawScopeStatus(plot, { waitingForTrigger: true });
          return;
        }

        frozenSamples = samples;

        // Single-shot: hold the first successful trigger and stop acquiring.
        if (singleShotArmed) {
          singleShotArmed = false;
          paused = true;
          $("pause").textContent = "Resume";
          $("pause").classList.add("active");
          updateSingleButton();
        }
      } else {
        samples = frozenSamples;
        if (!samples) {
          drawScopeStatus(plot, {
            waitingForTrigger:
              settings.triggerMode !== "none" || singleShotArmed,
          });
          return;
        }
      }

      drawWaveform(samples, plot);
      drawTriggerLevel(plot);
      updateScopeMeasurements(samples);
      drawScopeStatus(plot);
    }

    function drawSpectrumFrame(frameTime, width, height) {
      const plot = drawGrid(width, height, { mode: "spectrum" });

      let magnitudesDb;
      if (!paused) {
        magnitudesDb = computeAveragedSpectrum(spectrumTimeSamples(frameTime));
        frozenSpectrum = magnitudesDb;
        lastFrameTime = frameTime;
      } else {
        magnitudesDb = frozenSpectrum;
        if (!magnitudesDb) {
          drawSpectrumStatus(plot);
          return;
        }
      }

      updateSpectrumMeasurements(drawSpectrum(magnitudesDb, plot));
      drawSpectrumStatus(plot);
    }

    function drawFrame(frameTime) {
      requestAnimationFrame(drawFrame);
      readSettings();

      const width = canvas.width;
      const height = canvas.height;

      if (viewMode === "spectrum") {
        drawSpectrumFrame(frameTime, width, height);
      } else {
        drawScopeFrame(frameTime, width, height);
      }
    }

    // --- Actions / wiring ----------------------------------------------------
    function updateSingleButton() {
      const btn = $("single");
      btn.classList.toggle("active", singleShotArmed);
      btn.textContent = singleShotArmed ? "Armed" : "Single";
    }

    function armSingleShot() {
      readSettings();
      // Single-shot needs an edge; default to rising if currently free-running.
      if (settings.triggerMode === "none") {
        $("triggerMode").value = "rising";
        settings.triggerMode = "rising";
      }

      paused = false;
      $("pause").textContent = "Pause";
      $("pause").classList.remove("active");
      frozenSamples = null;
      singleShotArmed = true;
      updateSingleButton();
    }

    function togglePause() {
      paused = !paused;
      $("pause").textContent = paused ? "Resume" : "Pause";
      $("pause").classList.toggle("active", paused);
      if (!paused) {
        // Resuming cancels an armed single-shot wait.
        singleShotArmed = false;
        updateSingleButton();
      }
    }

    const timeStepper = createStepper({
      valueId: "timeValue",
      selectId: "time",
      downId: "timeDown",
      upId: "timeUp",
    });
    const voltsStepper = createStepper({
      valueId: "voltsValue",
      selectId: "volts",
      downId: "voltsDown",
      upId: "voltsUp",
    });
    createStepper({
      valueId: "fftSizeValue",
      selectId: "fftSize",
      downId: "fftSizeDown",
      upId: "fftSizeUp",
    });
    createStepper({
      valueId: "spanValue",
      selectId: "span",
      downId: "spanDown",
      upId: "spanUp",
    });
    createStepper({
      valueId: "dbDivValue",
      selectId: "dbDiv",
      downId: "dbDivDown",
      upId: "dbDivUp",
    });
    createStepper({
      valueId: "refLevelValue",
      selectId: "refLevel",
      downId: "refLevelDown",
      upId: "refLevelUp",
    });
    createStepper({
      valueId: "averagesValue",
      selectId: "averages",
      downId: "averagesDown",
      upId: "averagesUp",
    });

    $("triggerDown").onclick = () => bumpTriggerLevel(-1);
    $("triggerUp").onclick = () => bumpTriggerLevel(1);
    $("single").onclick = armSingleShot;
    $("tab-scope").onclick = () => setViewMode("scope");
    $("tab-spectrum").onclick = () => setViewMode("spectrum");
    $("input").onchange = setupAudio;
    $("pause").onclick = togglePause;

    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" && event.target.tagName !== "INPUT") {
        event.preventDefault();
        $("pause").click();
      }
    });

    canvas.addEventListener("click", (event) => {
      if (viewMode !== "scope") return;
      const rect = canvas.getBoundingClientRect();
      const plot = plotArea;
      const canvasY =
        ((event.clientY - rect.top) / rect.height) * canvas.height;
      const relativeY = (canvasY - plot.y) / plot.h;
      if (relativeY < 0 || relativeY > 1) return;
      settings.triggerVolts =
        Math.round((0.5 - relativeY) * fullScaleVolts * 10) / 10;
      clampTriggerLevel();
    });

    setViewMode("scope");
    generatorMode = $("input").value !== "microphone";
    syncGeneratorSettings();
    readSettings();
    drawFrame(0);
  </script>
</body>
</html>
